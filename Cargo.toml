[package]
name = "rust-embedded-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
test = false
doctest = false

[dependencies]
cortex-m = { version = "0.7.8", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.6"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6", default-features = false, features = [
    "stm32f407ig",
    "rt",
    "time-driver-tim2",
    "exti",
    "time",
] }
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }

embedded-hal = "1.0"
embassy-sync = "0.8"
libm = "0.2"
rtt-target = "0.6"
panic-rtt-target = "0.2"
heapless = "0.9"
embedded-can = "0.4"

